<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Plano Básico | Aulas de Inglês</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto max-w-lg p-6 my-12 bg-white rounded-3xl shadow-xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-700">Finalize sua Inscrição</h1>
            <p class="text-lg text-gray-600">Plano Básico</p>
        </div>

        <!-- Resumo do Plano -->
        <div class="border-b border-gray-200 pb-4 mb-6">
            <h2 class="text-xl font-bold text-gray-700 mb-2">Resumo do Pedido</h2>
            <ul class="text-gray-600 space-y-1">
                <li>✔️ Aulas 1x por semana</li>
                <li>✔️ Acesso à plataforma de exercícios</li>
                <li>✔️ Suporte via email</li>
            </ul>
            <div class="text-right font-bold text-2xl text-red-600 mt-4">
                Valor Total: R$ 99<span class="text-lg font-normal text-gray-500">/mês</span>
            </div>
        </div>

        <!-- Formulário de Dados -->
        <form action="#" method="POST">
            <h2 class="text-xl font-bold text-gray-700 mb-4">Seus Dados</h2>
            <div class="mb-4">
                <label for="name" class="block text-sm font-medium text-gray-700">Nome Completo</label>
                <input type="text" id="name" name="name" required class="mt-1 block w-full px-4 py-2 bg-gray-100 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" name="email" required class="mt-1 block w-full px-4 py-2 bg-gray-100 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div class="mb-6">
                <label for="phone" class="block text-sm font-medium text-gray-700">WhatsApp</label>
                <input type="tel" id="phone" name="phone" required class="mt-1 block w-full px-4 py-2 bg-gray-100 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <!-- Botão de Ação -->
            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-full transition duration-300 focus:outline-none focus:ring-4 focus:ring-blue-400">
                Confirmar e Pagar
            </button>
        </form>

        <!-- Link de Suporte -->
        <div class="text-center mt-6">
            <a href="https://api.whatsapp.com/send?phone=5511999998888&text=Preciso%20de%20ajuda%20para%20finalizar%20a%20compra." target="_blank" class="text-sm text-gray-500 hover:text-red-600 transition duration-300">
                Precisa de ajuda? Fale conosco no WhatsApp
            </a>
        </div>
    </div>

</body>
</html>
